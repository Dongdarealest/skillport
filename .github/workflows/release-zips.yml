name: Release ZIPs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the pack ZIPs to"
        required: true
        default: "v0.3.6"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Attach the pack ZIPs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            packs/human-touch-pack/human-touch-pack.zip \
            packs/design-pack/design-pack.zip \
            packs/writing-pack/writing-pack.zip \
            packs/coding-pack/coding-pack.zip \
            packs/shipsafe-pack/shipsafe-pack.zip
