name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - name: Check every pack ships all four targets
        run: |
          for p in packs/*/; do
            for t in for-claude for-cursor for-codex for-chatgpt; do
              test -d "$p$t" || { echo "MISSING $p$t"; exit 1; }
            done
          done
          echo "All packs complete for all four AIs."
